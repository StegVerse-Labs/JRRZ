<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Joint Replacement Recovery Trajectory</title>
  <desc id="desc">Conceptual patient-reported function trajectory showing a pre-operative baseline, an immediate post-surgical dip, a typical recovery range, and a gradual rise toward long-term strength and stability.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.title{font-size:34px;font-weight:700;fill:#163b5c}.axis{stroke:#66788a;stroke-width:3}.grid{stroke:#d8e0e8;stroke-width:1.5;stroke-dasharray:6 8}.label{font-size:18px;fill:#334155}.small{font-size:15px;fill:#52677a}.band{fill:#d7e9f7;stroke:#a6c9e8;stroke-width:1.5}.curve{fill:none;stroke:#1f78b4;stroke-width:6;stroke-linecap:round}.baseline{stroke:#2b6f9e;stroke-width:2;stroke-dasharray:7 8}.marker{fill:#1f78b4}.phase{font-size:15px;font-weight:700;fill:#163b5c}.foot{font-size:14px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text class="title" x="600" y="52" text-anchor="middle">Joint Replacement Recovery Trajectory</text>
  <line class="axis" x1="120" y1="560" x2="1090" y2="560"/><line class="axis" x1="120" y1="560" x2="120" y2="105"/>
  <line class="grid" x1="120" y1="330" x2="1050" y2="330"/><line class="baseline" x1="120" y1="330" x2="1050" y2="330"/>
  <path class="band" d="M205 330 C270 345 300 405 340 440 C450 445 565 390 680 315 C800 240 925 205 1040 190 L1040 115 C900 132 780 165 660 235 C545 302 445 355 340 372 C292 362 250 342 205 330 Z"/>
  <path class="curve" d="M205 330 C270 337 302 405 340 414 C445 432 560 356 680 285 C800 220 920 182 1040 160"/>
  <circle class="marker" cx="205" cy="330" r="8"/><circle class="marker" cx="340" cy="414" r="9"/>
  <text class="label" x="95" y="322" text-anchor="end">Pre-op</text><text class="label" x="95" y="344" text-anchor="end">baseline</text>
  <text class="label" x="340" y="462" text-anchor="middle">Surgery</text>
  <text class="label" x="690" y="185" text-anchor="middle">Typical recovery range</text>
  <text class="label" x="1085" y="590" text-anchor="end">Time</text>
  <text class="label" x="38" y="310" transform="rotate(-90 38 310)" text-anchor="middle">Patient-reported function</text>
  <g class="small">
    <text x="205" y="590" text-anchor="middle">Pre-op</text><text x="340" y="590" text-anchor="middle">Early weeks</text><text x="560" y="590" text-anchor="middle">3 months</text><text x="780" y="590" text-anchor="middle">6 months</text><text x="1000" y="590" text-anchor="middle">1 year</text>
  </g>
  <g transform="translate(120 615)">
    <rect x="0" y="0" width="185" height="42" rx="8" fill="#e8eef3"/><rect x="190" y="0" width="150" height="42" rx="8" fill="#dbe7f2"/><rect x="345" y="0" width="210" height="42" rx="8" fill="#eaf2fb"/><rect x="560" y="0" width="210" height="42" rx="8" fill="#edf4ee"/><rect x="775" y="0" width="195" height="42" rx="8" fill="#f4efe7"/>
    <text class="phase" x="92" y="27" text-anchor="middle">Preparation</text><text class="phase" x="265" y="27" text-anchor="middle">Surgery</text><text class="phase" x="450" y="27" text-anchor="middle">Early Recovery</text><text class="phase" x="665" y="27" text-anchor="middle">Functional Recovery</text><text class="phase" x="872" y="27" text-anchor="middle">Strength &amp; Stability</text>
  </g>
  <text class="foot" x="600" y="695" text-anchor="middle">Conceptual educational model — individual recovery varies; this is not medical advice or a patient-specific forecast.</text>
</svg>
